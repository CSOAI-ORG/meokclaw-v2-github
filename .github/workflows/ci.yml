name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  reliability:
    name: Offline reliability (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-reliability.txt
      - name: Install focused validation dependencies
        run: python -m pip install -r requirements-reliability.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -p 'test_reliability.py' -v
      - name: Check source compilation
        run: python -m compileall -q src tests/test_reliability.py
